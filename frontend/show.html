<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniFlix - Show Details</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--accent-color)',
                        dark: 'var(--bg-color)',
                        darker: 'var(--card-bg)',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --accent-color: #00a8e1;
            --bg-color: #0f171e;
            --card-bg: #19222c;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--card-bg); border-radius: 4px; border: 1px solid var(--bg-color); }
        ::-webkit-scrollbar-thumb:hover { background: #333; }
        .hero-vignette {
            background: linear-gradient(to right, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 40%, transparent 100%);
        }
        .hero-fade-bottom {
            background: linear-gradient(to top, var(--bg-color) 0%, transparent 100%);
        }
        .episode-card { transition: background-color 0.2s; }
        .episode-card:hover { background-color: var(--card-bg); }
    </style>
</head>
<body class="bg-dark text-white font-sans antialiased overflow-x-hidden">
    
    <!-- Hero Section -->
    <div id="showHero" class="relative w-full h-[50vh] min-h-[400px] bg-cover bg-center" style="background-image: url('/static/placeholder.jpg');">
        <!-- Gradients for text readability -->
        <div class="absolute inset-0 hero-vignette z-10"></div>
        <div class="absolute bottom-0 w-full h-1/2 hero-fade-bottom z-10"></div>
        
        <!-- Back Button -->
        <a href="/?tab=library" class="absolute top-6 left-6 z-30 flex items-center gap-2 text-gray-300 hover:text-white transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span class="font-bold text-lg drop-shadow-md">Back to Library</span>
        </a>

        <!-- Top Right Actions -->
        <button id="deleteShowBtn" class="absolute top-6 right-6 z-30 p-2 text-gray-400 hover:text-red-500 transition-colors bg-black/30 hover:bg-black/50 rounded-full backdrop-blur-sm" title="Delete Show">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>

        <!-- Content -->
        <div class="absolute bottom-10 left-6 md:left-12 z-20 max-w-2xl">
            <h1 id="showTitle" class="text-5xl md:text-6xl font-extrabold mb-4 drop-shadow-lg">Loading...</h1>
            <div class="flex items-center gap-4 text-sm md:text-base font-medium text-gray-300 mb-4 drop-shadow-md">
                <span class="text-green-500 font-bold">99% Match</span>
                <span id="showYear">2024</span>
                <span class="border border-gray-500 px-2 rounded text-xs">HD</span>
                <span id="showMeta"></span>
            </div>
            <p id="showDesc" class="text-gray-300 text-sm md:text-base leading-relaxed mb-8 drop-shadow-md line-clamp-4">
                Loading description...
            </p>
            <div class="flex gap-4">
                <button id="continueBtn" class="hidden bg-white hover:bg-gray-200 text-black font-bold py-3 px-8 rounded-lg transition-colors flex items-center gap-2">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    Play
                </button>
            </div>
        </div>
    </div>

    <!-- Video Player Overlay (Hidden by default) -->
    <div id="playerWrapper" class="fixed inset-0 bg-black z-50 hidden flex-col">
        <div class="absolute top-0 left-0 w-full p-6 bg-gradient-to-b from-black/80 to-transparent z-50 flex justify-between items-center transition-opacity duration-300" id="playerControls">
            <button onclick="closePlayer()" class="text-white hover:text-gray-300 flex items-center gap-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span class="font-bold text-xl drop-shadow-md">Back</span>
            </button>
            <div id="playerOverlay" class="font-bold text-xl drop-shadow-md"></div>
            <div class="w-8"></div><!-- Spacer for centering -->
        </div>
        <div class="flex-1 w-full h-full flex items-center justify-center bg-black relative">
            <video id="videoPlayer" class="w-full h-full object-contain" controls playsinline></video>
        </div>
    </div>

    <!-- Episodes Section Fade -->
    <div class="w-full h-24 bg-gradient-to-b from-transparent to-dark relative z-20 -mt-24"></div>

    <!-- Episodes Section -->
    <div class="max-w-7xl mx-auto px-6 md:px-12 py-10 relative z-20 bg-dark">
        <div class="flex items-center justify-between mb-8 border-b border-gray-800 pb-4">
            <h2 id="episodesHeading" class="text-2xl font-bold text-gray-200">Episodes</h2>
        </div>
        
        <div class="flex flex-col gap-4" id="showEpisodes">
            <p class="text-gray-500">Loading episodes...</p>
        </div>
    </div>

    <script src="static/scrapers.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
